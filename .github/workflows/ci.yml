name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
    inputs:
      build_version:
        type: string
        required: false
        default: ''
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Set automatic release version
        if: inputs.build_version != ''
        env:
          BUILD_VERSION: ${{ inputs.build_version }}
        run: node scripts/set-version.mjs
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: framefix-packages
          path: release/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: popup-previews
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
