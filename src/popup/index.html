<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FrameFix</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <header>
    <div class="wordmark"><span class="brand-dot" aria-hidden="true"></span>FrameFix</div>
    <label class="power-control">
      <span id="enabled-state" aria-hidden="true">ON</span>
      <input id="enabled" type="checkbox" role="switch" aria-describedby="quality-hint" disabled>
    </label>
  </header>
  <main>
    <section class="quality-section" aria-labelledby="quality-label">
      <label id="quality-label" for="quality" data-i18n="quality"></label>
      <div class="select-wrap">
        <button type="button" id="quality" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="quality-options" aria-labelledby="quality-label quality-value" aria-describedby="quality-hint" disabled>
          <span id="quality-value"></span>
          <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
        </button>
        <ul id="quality-options" role="listbox" aria-labelledby="quality-label" hidden></ul>
      </div>
      <p class="hint" id="quality-hint" data-i18n="fixedHint"></p>
    </section>
    <section class="bitrate-section" aria-labelledby="enhanced-label">
      <div class="toggle-row">
        <label id="enhanced-label" for="enhanced" data-i18n="enhanced"></label>
        <input id="enhanced" type="checkbox" role="switch" disabled>
      </div>
      <p class="hint" id="enhanced-hint" data-i18n="enhancedHint"></p>
    </section>
    <section class="theme-row">
    <span id="theme-label" data-i18n="appearance"></span>
    <div role="group" aria-labelledby="theme-label" class="themes">
<button type="button" data-theme="system" aria-pressed="true" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg></button>
<button type="button" data-theme="light" aria-pressed="false" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button>
<button type="button" data-theme="dark" aria-pressed="false" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14A9 9 0 0 1 10 3.5 9 9 0 1 0 20.5 14Z"/></svg></button>
</div>
    </section>
    <section class="language-row">
      <span id="language-label" data-i18n="language"></span>
      <div class="languages" role="group" aria-labelledby="language-label">
        <button type="button" data-language="auto" data-i18n="languageAuto" aria-pressed="true" disabled></button>
        <button type="button" data-language="ko" lang="ko" aria-pressed="false" disabled>한국어</button>
        <button type="button" data-language="en" lang="en" aria-pressed="false" disabled>English</button>
      </div>
    </section>
  </main>
  <footer>
    <div class="backup-actions">
      <button type="button" id="import-settings" data-i18n="importSettings" disabled></button>
      <button type="button" id="export-settings" data-i18n="exportSettings" disabled></button>
      <input type="file" id="settings-file" accept=".json,application/json" hidden>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </footer>
</body>
</html>
